services:

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: tranquility-timescaledb
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - /srv/tranquility/database:/var/lib/postgresql/data

    networks:
      - tranquility-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tranquility-mqtt
    restart: unless-stopped

    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /srv/tranquility/mqtt/secrets/passwords:/mosquitto/secrets/passwords:ro
      - /srv/tranquility/mqtt/data:/mosquitto/data
      - /srv/tranquility/mqtt/log:/mosquitto/log
    
    ports:
      - "127.0.0.1:1883:1883"

    networks:
      - tranquility-net


  grafana:
    image: grafana/grafana:latest
    container_name: tranquility-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}

    volumes:
      - /srv/tranquility/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana-dashboards:ro

    ports:
      - "3000:3000"

    networks:
      - tranquility-net


networks:
  tranquility-net:
    external: true
